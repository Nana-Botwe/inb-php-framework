# =============================================================================
#  INB PHP Framework — Apache virtual host (recommended over running from a sub-folder)
#  The DocumentRoot is public/, so app/, core/, .env, storage/ are outside the web root entirely.
#  The .htaccess files still add the request filter and headers.
# =============================================================================

<VirtualHost *:80>
    ServerName www.example.com
    Redirect permanent / https://www.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName www.example.com
    DocumentRoot /var/www/my-shop/current/public

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/www.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/www.example.com/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    ServerSignature Off

    <Directory /var/www/my-shop/current/public>
        AllowOverride All
        Require all granted
        Options -Indexes -MultiViews
    </Directory>

    # Defence in depth: deny everything above public/ even if a symlink or alias points there.
    <Directory /var/www/my-shop/current>
        Require all denied
    </Directory>
    <Directory /var/www/my-shop/current/public>
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/my-shop-error.log
    CustomLog ${APACHE_LOG_DIR}/my-shop-access.log combined
</VirtualHost>

# In the main apache2.conf / httpd.conf:
#   ServerTokens Prod
#   TraceEnable Off
