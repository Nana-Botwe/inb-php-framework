# Supervisor keeps the queue worker running and restarts it if it crashes (Linux).
#   sudo cp deploy/supervisor-queue.conf /etc/supervisor/conf.d/my-shop-queue.conf
#   sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl status

[program:my-shop-queue]
command=php /var/www/my-shop/current/console queue:work --sleep=3
directory=/var/www/my-shop/current
user=www-data
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=60
stdout_logfile=/var/www/my-shop/shared/storage/logs/queue-worker.log
stderr_logfile=/var/www/my-shop/shared/storage/logs/queue-worker-error.log
