# =============================================================================
#  INB PHP Framework — Nginx site (equivalent of the .htaccess rules, which Nginx ignores)
#  Copy to /etc/nginx/sites-available/my-shop, adjust server_name, root and the PHP-FPM socket.
#  After deploying, verify from outside:  php console security:scan https://www.example.com
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name www.example.com example.com;
    return 301 https://www.example.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.example.com;

    # The document root MUST be public/ — nothing else is reachable.
    root /var/www/my-shop/current/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/www.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 12m;
    charset utf-8;

    # Only answer for our own host names (Host-header poisoning protection, also done in PHP).
    if ($host !~* ^(www\.example\.com)$) { return 444; }

    # Block dangerous methods.
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) { return 405; }

    # Hidden files (.env, .git, .htaccess) — except .well-known for certificates.
    location ~ /\.(?!well-known) { deny all; return 404; }

    # Backups, logs, databases, sources.
    location ~* \.(env|ini|log|sql|sqlite|db|bak|backup|old|orig|swp|dist|lock|ya?ml|conf|stub|sh|bat|ps1|phar|phtml|phps)$ { deny all; return 404; }

    # Uploads are data, never code.
    location ^~ /uploads/ {
        location ~ \.(php\d?|phtml|phar|pl|py|cgi|sh|html?|svg|js)$ { deny all; return 404; }
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ONLY the front controller may execute.
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
    }
    location ~ \.php$ { return 404; }

    # Static assets: long cache + compression.
    location ~* \.(css|js|svg|webp|png|jpe?g|gif|ico|woff2?)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
}

